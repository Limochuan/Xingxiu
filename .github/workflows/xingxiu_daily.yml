name: Xingxiu Daily Sync

on:
  schedule:
    # 每天雅加达时间（UTC+7）运行
    # JKT 01:30
    - cron: '30 18 * * *'
    # JKT 04:30
    - cron: '30 21 * * *'
    # JKT 14:30
    - cron: '30 7 * * *'
    # JKT 18:30
    - cron: '30 11 * * *'

  workflow_dispatch:
    inputs:
      target_date:
        description: '指定日期 YYYY-MM-DD（留空则用雅加达昨天）'
        required: false
        type: string

jobs:
  sync-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run sync_xingxiu_daily_and_report
        env:
          # 数据库连接
          XINGXIU_DB_HOST: ${{ secrets.DB_HOST }}
          XINGXIU_DB_PORT: ${{ secrets.DB_PORT }}
          XINGXIU_DB_USER: ${{ secrets.DB_USER }}
          XINGXIU_DB_PASS: ${{ secrets.DB_PASS }}
          XINGXIU_DB_NAME: ${{ secrets.DB_NAME }}

          # API 基础地址
          XINGXIU_BASE_URL: ${{ secrets.API_BASE_URL }}

          # 手动触发时可传日期
          TARGET_DATE: ${{ github.event.inputs.target_date }}

        run: |
          # -u 关闭 python 输出缓冲，方便看日志
          python -u daily_sync/sync_xingxiu_daily_and_report.py
