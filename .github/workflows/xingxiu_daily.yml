name: Xingxiu Daily Sync

on:
  schedule:
    # 每天 JKT 01:30（UTC+7）运行，对应 UTC 18:30
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '指定日期 YYYY-MM-DD（留空则用雅加达昨天）'
        required: false
        type: string

jobs:
  sync-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run sync_xingxiu_daily_and_report
        env:
          # 映射真实的数据库 secrets
          XINGXIU_DB_HOST: ${{ secrets.DB_HOST }}
          XINGXIU_DB_PORT: ${{ secrets.DB_PORT }}
          XINGXIU_DB_USER: ${{ secrets.DB_USER }}
          XINGXIU_DB_PASS: ${{ secrets.DB_PASS }}
          XINGXIU_DB_NAME: ${{ secrets.DB_NAME }}

          # API 基础地址（映射 API_BASE_URL）
          XINGXIU_BASE_URL: ${{ secrets.API_BASE_URL }}

          # 传递手动输入的日期
          TARGET_DATE: ${{ github.event.inputs.target_date }}

        run: |
          # -u 让 python 不要缓冲日志，能即时看到输出
          python -u daily_sync/sync_xingxiu_daily_and_report.py
