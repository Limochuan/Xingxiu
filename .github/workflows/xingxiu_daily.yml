name: Xingxiu Daily Sync

on:
  schedule:
    # 每天 JKT 01:30（UTC+7）运行，对应 UTC 18:30
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '指定日期 YYYY-MM-DD（留空则用雅加达昨天）'
        required: false
        type: string

jobs:
  sync-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run sync_xingxiu_daily_and_report
        env:
          XINGXIU_DB_HOST: ${{ secrets.XINGXIU_DB_HOST }}
          XINGXIU_DB_PORT: ${{ secrets.XINGXIU_DB_PORT }}
          XINGXIU_DB_USER: ${{ secrets.XINGXIU_DB_USER }}
          XINGXIU_DB_PASS: ${{ secrets.XINGXIU_DB_PASS }}
          XINGXIU_DB_NAME: ${{ secrets.XINGXIU_DB_NAME }}
          XINGXIU_BASE_URL: ${{ secrets.XINGXIU_BASE_URL }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          python daily_sync/sync_xingxiu_daily_and_report.py
