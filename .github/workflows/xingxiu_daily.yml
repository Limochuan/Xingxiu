name: Daily Sync (Jakarta 02:00)

on:
  schedule:
    - cron: "0 19 * * *"   # 02:00 Asia/Jakarta
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD) in Asia/Jakarta; leave empty to use JKT 'yesterday'"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      DATE_STR: ${{ github.event.inputs.date }}

      DEVICE_TABLE: xingxiu_device_info
      DAILY_TABLE:  xingxiu_daily
      REPORT_TABLE: xingxiu_daily_report

      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_NAME }}

      # ✅ 关键修正：脚本需要 API_BASE
      API_BASE:     ${{ secrets.API_BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}  # 可选保留

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch daily data into DB
        run: python daily_sync/fetch_and_store_daily.py

      - name: Merge daily into business report
        run: python daily_sync/merge_daily_to_report_upsert.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sync-logs
          path: merge_daily.log
          if-no-files-found: ignore
          retention-days: 7
