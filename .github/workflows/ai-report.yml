name: AI Analyze Daily Report (JKT 02:30)

on:
  schedule:
    # 02:30 Asia/Jakarta == 19:30 UTC（前一日）
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD) in Asia/Jakarta; leave empty to use JKT 'yesterday'"
        required: false
        type: string
        default: ""
      project:
        description: "PROJECT_FILTER (default: Kalteng GIJ 中加一园)"
        required: false
        type: string
        default: "Kalteng GIJ 中加一园"

permissions:
  contents: read

concurrency:
  group: ai-analyze-daily-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TZ: Asia/Jakarta

      # 手动触发输入
      DATE_STR: ${{ github.event.inputs.date }}
      PROJECT_FILTER_INPUT: ${{ github.event.inputs.project }}

      # 业务表名（如需改名，在这里改）
      REPORT_TABLE: xingxiu_daily_report

      # 数据库凭据（从 Secrets 注入）
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_NAME }}

      # OpenAI / 代理（从 Secrets 注入）
      OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
      OPENAI_MODEL:    ${{ secrets.OPENAI_MODEL }}

      # 并发/超时/批量
      MAX_WORKERS: "8"
      OPENAI_TIMEOUT: "60"
      OPENAI_RETRIES: "2"
      BATCH_UPDATE_SIZE: "100"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Resolve TARGET_DATE & PROJECT_FILTER
        shell: bash
        run: |
          if [ -z "${DATE_STR}" ]; then
            YDAY=$(date -d "TZ=\"${TZ}\" yesterday" +%F 2>/dev/null || true)
            if [ -z "$YDAY" ]; then YDAY=$(TZ="${TZ}" date -v-1d +%F); fi
            echo "TARGET_DATE=$YDAY" >> "$GITHUB_ENV"
            echo "Resolved TARGET_DATE=$YDAY"
          else
            echo "TARGET_DATE=${DATE_STR}" >> "$GITHUB_ENV"
            echo "Using TARGET_DATE=${DATE_STR}"
          fi

          if [ -z "${PROJECT_FILTER_INPUT}" ]; then
            echo "PROJECT_FILTER=Kalteng GIJ 中加一园" >> "$GITHUB_ENV"
          else
            echo "PROJECT_FILTER=${PROJECT_FILTER_INPUT}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: Run AI analyzer
        run: |
          python -X utf8 daily_sync/ai_analyzer.py 2>&1 | tee ai_analyzer.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-analyzer-logs
          path: ai_analyzer.log
          retention-days: 7
          if-no-files-found: warn
