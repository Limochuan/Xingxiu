name: Fetch & Store Daily (JKT 01:30)

on:
  schedule:
    - cron: "30 18 * * *"  # UTC 18:30 == Asia/Jakarta 01:30 (next day)
  workflow_dispatch: {}     # 手动触发方便调试

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # 从仓库 Secrets 里取，先去 Settings -> Secrets and variables -> Actions 配置
      API_BASE_URL: ${{ secrets.API_BASE_URL }}  # 建议设置为 http://119.47.88.14:81/admin/common/mechanical/ai_export
      DB_HOST:      ${{ secrets.DB_HOST }}
      DB_PORT:      ${{ secrets.DB_PORT }}
      DB_USER:      ${{ secrets.DB_USER }}
      DB_PASS:      ${{ secrets.DB_PASS }}
      DB_NAME:      ${{ secrets.DB_NAME }}
      DB_TABLE:     ${{ secrets.DB_TABLE }}
      # 可选：手动覆盖日期（格式 YYYY-MM-DD）。如不设，脚本会按 Asia/Jakarta 自动取“昨天”
      # DATE_OVERRIDE: "2025-10-02"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job
        run: |
          python fetch_and_store_daily.py
